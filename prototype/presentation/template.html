@media(max-width:759px){.topbar{height:auto;min-height:64px;padding:14px;align-items:flex-start}.top-actions{flex-wrap:wrap;justify-content:flex-end}.brand{font-size:12px}.topbar small{font-size:10px}.top-actions button,.top-actions a{font-size:10px;padding:7px}.stage-wrap{padding:12px}.stage{width:100%!important;height:auto!important}.slide{position:relative;width:100%;height:auto;min-height:0;transform:none!important;padding:26px 22px 65px;border-radius:12px;overflow:visible}.slide.active{display:flex}.slide h2,.slide[data-index="0"] h2{font-size:32px}.slide .lead,.slide[data-index="0"] .lead{font-size:16px;margin-bottom:22px}.eyebrow{font-size:9px}.hero-layout,.grid.two,.grid.three,.harness-flow{grid-template-columns:1fr;gap:14px}.hero-layout{gap:25px}.cover-visual{padding:18px}.box{padding:19px}.box p,.box li{font-size:16px}.stats{grid-template-columns:repeat(2,1fr)}.three-stats{grid-template-columns:1fr}.stats b{font-size:37px}.slide-body{gap:17px}.callout{font-size:14px}.picture-pair img,.result-slide img{height:auto;max-height:350px}.architecture{height:auto;min-height:140px}.compact .box p{font-size:15px}.harness-flow>div{padding:16px}.harness-flow span{font-size:18px;margin-bottom:8px}.harness-flow p{margin-top:7px}.demo-steps span{font-size:14px}.demo-steps b{font-size:16px}footer{left:22px;right:22px;bottom:19px;font-size:9px}.showcase-layout{grid-template-columns:1fr}.showcase-nav{flex-direction:row;flex-wrap:wrap;gap:4px}.showcase-nav a{font-size:12px;padding:8px}.showcase-header{align-items:flex-start;flex-direction:column}#showcase{padding:20px 14px}.showcase-header h1{font-size:26px}.showcase-main{padding:16px}pre{font-size:11px}#notes{margin:8px 12px}button,a.button{font-size:12px}.controls{gap:8px}}
@page{size:1280px 720px;margin:0}@media print{html,body{width:1280px;margin:0;background:white;print-color-adjust:exact;-webkit-print-color-adjust:exact}.topbar,.controls,.progress,#notes,#showcase,dialog{display:none!important}.stage-wrap{padding:0;display:block}.stage{width:1280px!important;height:auto!important}.slide,.slide.active{display:flex!important;flex-direction:column!important;position:relative;width:1280px;height:720px;min-height:720px;transform:none!important;border-radius:0;box-shadow:none;break-after:page;page-break-after:always;padding:39px 54px 56px;overflow:hidden}.slide:last-child{break-after:auto;page-break-after:auto}.slide h2{font-size:36px}.slide[data-index="0"] h2{font-size:58px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(4,1fr)}.three-stats{grid-template-columns:repeat(3,1fr)}.hero-layout{grid-template-columns:1.3fr .7fr}.harness-flow{grid-template-columns:repeat(5,1fr)}a{color:var(--primary);text-decoration:none}}
.prepared-by{margin:20px 0 12px;font-size:17px;line-height:1.4}.prepared-by span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.prepared-by strong{display:block;font-weight:600}</style></head><body><header class="topbar"><div class="brand">Medical Engagement Workbench<small>Presentation &amp; guided walkthrough</small></div><div class="top-actions"><button class="secondary" id="outlineButton">Slides</button><a class="button" href="#demo=profile">Walkthrough</a><button class="secondary" id="notesButton">Presenter notes</button><button class="secondary" id="fullscreenButton">Full screen</button></div></header><div id="presentation"><div class="stage-wrap"><main id="stage" class="stage">__SLIDES__</main></div><nav class="controls" aria-label="Slide controls"><button id="previous" aria-label="Previous slide">Previous</button><span id="position" aria-live="polite"></span><button id="next" aria-label="Next slide">Next</button></nav><div class="progress"><i id="progress"></i></div><aside id="notes" aria-label="Presenter notes"></aside></div><main id="showcase"><div class="showcase-header"><div><h1>Explore the workbench</h1><p>Screenshot walkthrough | 24 October 2026 | Synthetic CRM | No live API calls in this view</p></div><a class="button secondary" href="#slide=1">Back to presentation</a></div><div class="showcase-layout"><nav id="demoNav" class="showcase-nav" aria-label="Walkthrough sections"></nav><article class="showcase-main"><h2 id="demoTitle"></h2><p id="demoCaption"></p><img id="demoImage" class="zoomable" tabindex="0" alt=""><div class="actions"><a class="button" href="http://localhost:8502" target="_blank" rel="noopener">Open local live app</a><span class="small muted">Requires the app running on this computer.</span></div></article></div></main><dialog id="zoom"><button class="secondary" id="closeZoom">Close</button><img id="zoomImage" alt="Enlarged screenshot"></dialog><dialog id="outline" class="menu-dialog"><button class="secondary" id="closeOutline">Close</button><h2>Slide outline</h2><div id="outlineLinks"></div></dialog>
<script>
const gallery=__GALLERY__,notes=__NOTES__,slides=[...document.querySelectorAll('.slide')];let current=0;
function fit(){if(innerWidth<760)return;let scale=Math.min((innerWidth-44)/1280,(innerHeight-125)/720,1.2);scale=Math.max(.25,scale);document.documentElement.style.setProperty('--scale',scale);document.getElementById('stage').style.width=1280*scale+'px';document.getElementById('stage').style.height=720*scale+'px'}
function route(){const params=new URLSearchParams(location.hash.slice(1)),demo=params.get('demo');document.getElementById('presentation').style.display=demo?'none':'block';document.getElementById('showcase').style.display=demo?'block':'none';if(demo){const item=gallery.find(x=>x.id===demo)||gallery[0];document.getElementById('demoTitle').textContent=item.title;document.getElementById('demoCaption').textContent=item.caption;const img=document.getElementById('demoImage');img.src=item.image;img.alt=item.title;document.querySelectorAll('#demoNav a').forEach(a=>a.classList.toggle('active',a.hash==='#demo='+item.id))}else{const value=Number(params.get('slide')||1);current=Number.isFinite(value)?Math.max(0,Math.min(slides.length-1,Math.trunc(value)-1)):0;slides.forEach((slide,index)=>{slide.classList.toggle('active',index===current);slide.setAttribute('aria-hidden',index===current?'false':'true')});document.getElementById('position').textContent=current+1+' / '+slides.length;document.getElementById('progress').style.width=(current+1)/slides.length*100+'%';document.getElementById('previous').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;const pane=document.getElementById('notes');pane.replaceChildren();const title=document.createElement('h3');title.textContent=notes[current].title;const content=document.createElement('p');content.textContent=notes[current].notes;const refs=document.createElement('p');refs.className='refs';refs.textContent='Evidence: '+notes[current].refs.join(' | ');pane.append(title,content,refs);fit()}document.getElementById('outline').close();window.scrollTo(0,0)}
function step(offset){location.hash='slide='+(Math.max(0,Math.min(slides.length-1,current+offset))+1)}
document.getElementById('previous').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);document.getElementById('notesButton').onclick=()=>document.getElementById('notes').classList.toggle('open');document.getElementById('fullscreenButton').onclick=()=>{const result=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();result?.catch(()=>{})};
gallery.forEach(item=>{const link=document.createElement('a');link.href='#demo='+item.id;link.textContent=item.title;document.getElementById('demoNav').append(link)});notes.forEach((item,index)=>{const link=document.createElement('a');link.href='#slide='+(index+1);link.textContent=String(index+1).padStart(2,'0')+' | '+item.title;document.getElementById('outlineLinks').append(link)});document.getElementById('outlineButton').onclick=()=>document.getElementById('outline').showModal();document.getElementById('closeOutline').onclick=()=>document.getElementById('outline').close();document.getElementById('closeZoom').onclick=()=>document.getElementById('zoom').close();
document.addEventListener('click',event=>{if(event.target.matches('.zoomable')){document.getElementById('zoomImage').src=event.target.src;document.getElementById('zoomImage').alt=event.target.alt;document.getElementById('zoom').showModal()}});document.addEventListener('keydown',event=>{if(event.target.matches('.zoomable')&&(event.key==='Enter'||event.key===' ')){event.preventDefault();event.target.click();return}if(document.querySelector('dialog[open]')||event.target.closest('button,a,input'))return;if(location.hash.startsWith('#demo='))return;if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();step(1)}if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();step(-1)}if(event.key==='Home'){event.preventDefault();location.hash='slide=1'}if(event.key==='End'){event.preventDefault();location.hash='slide='+slides.length}if(event.key.toLowerCase()==='n')document.getElementById('notesButton').click()});window.addEventListener('hashchange',route);window.addEventListener('resize',fit);route();
</script></body></html>
